- { author: tori, time: "5/11", body: "Cali's right lung is doing much better, and no brain bleeds found on the head ultrasound either. They found a moderate murmur on his echo and will start with some medication to help close his PDA." }
- { author: tyler, time: "5/12", body: "IVC was removed and an IV was placed on his right hand. Cali had his food fortified. We got a call around 8pm that the fortified food did not sit well and he even reched up his breathing tube - will move to a slower feed rate to see if that helps." }
- { author: tyler, time: "5/15", body: "Cali's PDA closed slighly, moved from Moderate to Slight-Moderate. He started a second round of the medication in hopes for it to continue to close. He will get a follow up Echo on 5/18 to review the second round of medication. He also came off of the humidity, and got a new bed." }
- { author: tyler, time: "5/19", body: "Cali opened his eyes for the first time! He also started a 10day tapered round of steriods for his lung development." }
- { author: tyler, time: "5/25", body: "Cali got his second blood transfusion. His WBC went down and the Dr. ordered a brain ultrasound to check for any brain bleeds." }
- { author: tyler, time: "5/26", body: "UPDATE: ultrasound results came in and there were no brain bleeds!" }
- { author: tyler, time: "5/29", body: "Cali came off the Jet ventilator at 2pm and moved to a Volume mode on the traditional ventilator." }
- { author: tyler, time: "6/03", body: "Extubated Cali today! He moved to a CPAP style ventilator to see how he does. A big change in less than a week to go from the Jet to the traditional ventilator, to CPAP." }
- { author: tyler, time: "6/04", body: "Cali made it 24hrs on the CPAP ventilator but seemed to get pretty tired so they intubated him again but with a larger tube this time as he has grown. He has also passed the 2lb mark." }
- { author: tyler, time: "6/09", body: "Dad got to give Cali a tubby for the first time - he did really well. Hopefully this is the last day for his antibiotic" }
- { author: tyler, time: "6/15", body: "we started a 10 day DART course of steroids to promote his lung development and are tying to slowly ween the ventilator settings with a goal of trialing extubation at the end of the steroid course. Cali’s first eye exam is scheduled for 6/21." }
- { author: tyler, time: "6/17", body: "Cali moved to a NAVA setting on his ventilator - a similar mode to what the CPAP would be like if he was extubated." }
- { author: tyler, time: "6/19", body: "Cali was extubated today! Praying he tolerates it well and can stay on the CPAP. He has another 2 days left on DART." }
