- { author: tori, time: "5/11", body: "Cali's right lung is doing much better, and no brain bleeds found on the head ultrasound either. They found a moderate murmur on his echo and will start with some medication to help close his PDA." }
- { author: tyler, time: "5/12", body: "IVC was removed and an IV was placed on his right hand. Cali had his food fortified. We got a call around 8pm that the fortified food did not sit well and he even reched up his breathing tube - will move to a slower feed rate to see if that helps." }
- { author: tyler, time: "5/15", body: "Cali's PDA closed slighly, moved from Moderate to Slight-Moderate. He started a second round of the medication in hopes for it to continue to close. He will get a follow up Echo on 5/18 to review the second round of medication. He also came off of the humidity, and got a new bed." }
- { author: tyler, time: "5/19", body: "Cali opened his eyes for the first time! He also started a 10day tapered round of steriods for his lung development." }
- { author: tyler, time: "5/25", body: "Cali got his second blood transfusion. His WBC went down and the Dr. ordered a brain ultrasound to check for any brain bleeds." }
- { author: tyler, time: "5/26", body: "UPDATE: ultrasound results came in and there were no brain bleeds!" }
- { author: tyler, time: "5/29", body: "Cali came off the Jet ventilator at 2pm and moved to a Volume mode on the traditional ventilator." }
- { author: tyler, time: "6/03", body: "Extubated Cali today! He moved to a CPAP style ventilator to see how he does. A big change in less than a week to go from the Jet to the traditional ventilator, to CPAP." }
- { author: tyler, time: "6/04", body: "Cali made it 24hrs on the CPAP ventilator but seemed to get pretty tired so they intubated him again but with a larger tube this time as he has grown. He has also passed the 2lb mark." }
- { author: tyler, time: "6/09", body: "Dad got to give Cali a tubby for the first time - he did really well. Hopefully this is the last day for his antibiotic" }
- { author: tyler, time: "6/15", body: "we started a 10 day DART course of steroids to promote his lung development and are tying to slowly ween the ventilator settings with a goal of trialing extubation at the end of the steroid course. Cali’s first eye exam is scheduled for 6/21." }
- { author: tyler, time: "6/17", body: "Cali moved to a NAVA setting on his ventilator - a similar mode to what the CPAP would be like if he was extubated." }
- { author: tyler, time: "6/19", body: "Cali was extubated today! Praying he tolerates it well and can stay on the CPAP. He has another 2 days left on DART." }
- { author: tyler, time: "6/24", body: "test results came back and Cali has a UTI. They are starting him on antibiotics for 7 days. They will also be testing the culture to see which particular antibiotic will be the most effective - if it changes it will be 7 more days from that point." }
- { author: tyler, time: "6/28", body: "Cali is experiencing some edema so they are putting him on some diuretic medication to help expel any excess fluid. He also got an additional feeding tube put in to help vent his stomach of any excess air." }
- { author: tyler, time: "7/09", body: "Cali was extubated yesterday - we first attempted regular CPAP but ultimately moved to NivNAVA as a first step." }
- { author: tori, time: "7/12", body: "Cali is trialing moving from NIV NAVA to CPAP and seems to be tolerating it well. He also has a follow up eye exam tomorrow to see if his vessels have continued to grow" }
- { author: tyler, time: "7/13", body: "We had a good eye exam this morning, Cali has improved from Stage II to between Stage I & II. He has also tolerated the NIV NAVA level of 0 and we will attempt CPAP tomorrow assuming he continues to trend well." }
- { author: tori, time: "7/16", body: "Cali has gone from NIV NAVA, to CPAP, to bubble CPAP over the past week or so and is succeeding all of our expectations! He also got to do some physical therapy in the water and was loving it!" }
- { author: tyler, time: "7/20", body: "It was a big weekend for the boys - we  were able to open the top to Cali’s isolette, he started wearing some onesies, and Shae got to hold his little brother for the first time. He surprisingly did so well - was sweet and excited" }
- { author: tyler, time: "7/20", body: "today we decreased Cali’s bubble CPAP setting to 8 and he increased his feed to 42ml’s." }
- { author: tori, time: "7/23", body: "Cali was weaned to 7 on his bubble CPAP settings today. He also has his own little closet set up now and is wearing his own clothes" }
- { author: tyler, time: "7/24", body: "Today Cali got a tubby and when we were done the nurses surprised us with a crib for him instead of his isolette!" }
- { author: tori, time: "7/26", body: "Praying big for Cali’s vessels in his eyes to continue to grow properly and for him to be able to wean from some medications following his bloodwork tomorrow" }
- { author: tori, time: "7/28", body: "Cali was weaned to 6 on his bubble settings! He also had no changes on his eye exam and echo, but no concerns there at this time. He will have a follow up eye appt in 2 weeks and in 2months for his echo." }
- { author: tyler, time: "7/30", body: "Cali has been weened to 6 on his bubble CPAP and seems to be tolerating it well. We have also started some PT in preparation for trying breast/bottle feeding in the coming weeks once he moves from bubble to a nasal cannula. We have had good results on his Echo and eye exams and are praying those things resolve on their own without the need for intervention." }
- { author: tyler, time: "7/31", body: "Cali moved to a bubble level of 5 and also increased his feed to 55ml!" }
- { author: tori, time: "8/05", body: "Cali is 3 months old this week and made the switch to the nasal cannula/vapotherm today! Praying big that he stays strong and adjusts well to the change" }
- { author: tori, time: "8/07", body: "Cali is handling vapotherm so well and he’s already been weaned to 4 liters!" }
- { author: tori, time: "8/09", body: "Weaned to 3 liters today and Shae got to help give Cali a tubby!" }
- { author: tori, time: "8/10", body: "No changes on Cali’s eye exam today, they’ll follow up again next week. He was also able to come off of his supplements after some positive bloodwork results" }
- { author: tori, time: "8/11", body: "Big news today! Cali weaned to 2 liters!! Waiting on the go ahead to start to learn to eat!" }
- { author: tori, time: "8/12", body: "Had a little bit of a rough night and switched back to level 3 on a new device with the same pressures as vapotherm" }
