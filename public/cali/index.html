            <!-- FEEDING UPDATES -->
            <script>
            (function () {
              const data = [
                { date: "05/06", ml: 0 },
                { date: "05/07", ml: 1.5 },
                { date: "05/08", ml: 3.5 },
                { date: "05/09", ml: 4.5 },
                { date: "05/10", ml: 6.5 },
                { date: "05/11", ml: 8.5 },
                { date: "05/12", ml: 10 },
                { date: "05/13", ml: 12 },
                { date: "05/14", ml: 14 },
                { date: "05/15", ml: 14 },
                { date: "05/16", ml: 14.5 },
                { date: "05/17", ml: 15 },
                { date: "05/18", ml: 16 },
                { date: "05/19", ml: 15 },
                { date: "05/20", ml: 16 },
                { date: "05/21", ml: 16 },
                { date: "05/22", ml: 14 },
                { date: "05/23", ml: 15 },
                { date: "05/24", ml: 16 },
                { date: "05/25", ml: 16 },
                { date: "05/26", ml: 16 },
                { date: "05/27", ml: 16 },
                { date: "05/28", ml: 16 },
              ];

              const recent = data.slice(-5);
              const yStep = 5;
              const maxY = Math.ceil(Math.max(...recent.map(d => d.ml)) / yStep) * yStep + yStep;
              const pad = { t: 8, r: 8, b: 24, l: 32 };
              const svgW = 300;
              const colW = Math.floor((svgW - pad.l - pad.r) / recent.length);
              const plotH = 100;
              const svgH = pad.t + plotH + pad.b;
              const plotW = colW * recent.length;
              const ns = "http://www.w3.org/2000/svg";

              function xPos(i)  { return pad.l + i * colW + colW / 2; }
              function yPos(ml) { return pad.t + plotH - (ml / maxY) * plotH; }

              const svg = document.createElementNS(ns, "svg");
              svg.setAttribute("viewBox", `0 0 ${svgW} ${svgH}`);
              svg.setAttribute("class", "w-full");

              // horizontal grid lines + y-axis labels
              for (let ml = 0; ml <= maxY; ml += yStep) {
                const y = yPos(ml);
                const gl = document.createElementNS(ns, "line");
                gl.setAttribute("x1", pad.l); gl.setAttribute("y1", y);
                gl.setAttribute("x2", pad.l + plotW); gl.setAttribute("y2", y);
                gl.setAttribute("stroke", ml === 0 ? "#d1d5db" : "#EFECDE");
                gl.setAttribute("stroke-width", "1");
                svg.appendChild(gl);

                const lbl = document.createElementNS(ns, "text");
                lbl.setAttribute("x", pad.l - 4);
                lbl.setAttribute("y", y + 3);
                lbl.setAttribute("text-anchor", "end");
                lbl.setAttribute("font-size", "9");
                lbl.setAttribute("fill", "#5c5b56");
                lbl.setAttribute("font-family", "Inter, sans-serif");
                lbl.textContent = ml + "ml";
                svg.appendChild(lbl);
              }

              // x-axis date labels + vertical column lines
              recent.forEach(function(d, i) {
                const x = xPos(i);
                const cl = document.createElementNS(ns, "line");
                cl.setAttribute("x1", x); cl.setAttribute("y1", pad.t);
                cl.setAttribute("x2", x); cl.setAttribute("y2", pad.t + plotH);
                cl.setAttribute("stroke", "#f9fafb"); cl.setAttribute("stroke-width", "1");
                svg.appendChild(cl);

                const lbl = document.createElementNS(ns, "text");
                lbl.setAttribute("x", x);
                lbl.setAttribute("y", svgH - 6);
                lbl.setAttribute("text-anchor", "middle");
                lbl.setAttribute("font-size", "9");
                lbl.setAttribute("fill", "#5c5b56");
                lbl.setAttribute("font-family", "Inter, sans-serif");
                lbl.textContent = d.date;
                svg.appendChild(lbl);
              });

              // smooth connecting line (catmull-rom)
              const pts = recent.map(function(d, i) { return { x: xPos(i), y: yPos(d.ml) }; });
              let d = "M " + pts[0].x + "," + pts[0].y;
              for (let i = 0; i < pts.length - 1; i++) {
                const p0 = pts[i - 1] || pts[i];
                const p1 = pts[i];
                const p2 = pts[i + 1];
                const p3 = pts[i + 2] || pts[i + 1];
                const cp1x = p1.x + (p2.x - p0.x) / 6;
                const cp1y = p1.y + (p2.y - p0.y) / 6;
                const cp2x = p2.x - (p3.x - p1.x) / 6;
                const cp2y = p2.y - (p3.y - p1.y) / 6;
                d += " C " + cp1x + "," + cp1y + " " + cp2x + "," + cp2y + " " + p2.x + "," + p2.y;
              }
              const path = document.createElementNS(ns, "path");
              path.setAttribute("d", d);
              path.setAttribute("fill", "none");
              path.setAttribute("stroke", "#A93D0D");
              path.setAttribute("stroke-width", "2");
              path.setAttribute("stroke-linecap", "round");
              svg.appendChild(path);

              document.getElementById("feeding-graph").appendChild(svg);
            })();
            </script>
